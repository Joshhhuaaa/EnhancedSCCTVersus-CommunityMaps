name: Validate

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # The signature check uses Windows CNG.
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check maps and index
      shell: pwsh
      run: ./tools/Test-Maps.ps1
